[package]
name = "horizon-mod-big-nukes"
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false
description = "Big Nukes for Horizon, a native mod: bombs whose shockwave rolls across the land."

# The mod's rules and their tests: the same file the bundle adds to the game
# as `game::big_nukes`. The glue (mixins/big_nukes_native/glue.rs) names game
# types and is compiled only inside Horizon.
[lib]
path = "mixins/big_nukes_native/runtime.rs"

# Both are in Horizon's Cargo.lock, so the staged game builds them too.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Checks the renderer's WGSL in the tests, with the naga of Horizon's wgpu 30.
[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
