id = "big_nukes"
kind = "mod"
name = "Big Nukes (assets)"
summary = "The textures, models, sounds, text and recipes of Big Nukes. Needs the Big Nukes native mod."
description = """
**This is one of the two parts of [Big Nukes](https://playhorizon.dev/mods/big_nukes_native), and does nothing alone.** Install both: this one, the assets, and the native part. If one is missing, the game says so in chat.

It holds the mod's models and textures, its sounds, its English and Russian text, its recipes and drops, its screens' menus, its radiation effect and the uranium ore in the world's generation. It has no code. The code, and the description of what the mod does, are in Big Nukes.

All the art and sounds are original. No Minecraft assets are included. MIT licensed."""
