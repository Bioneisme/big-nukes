[mod]
id = "big_nukes_native"
version = "0.1.0"
priority = 100

# The Horizon source this bundle is planned and built on: Nightly 2026-11-05
# (`nightly-source/2026-11-05-66f3981`). It needs API 126 (`native_edit_blocks`).
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

# The rules: no game type, also the mod's Cargo library (its tests).
[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes"
source = "runtime.rs"

# The renderer's share: the clouds and the rings, over the finished world.
[[module]]
id = "sky"
file = "crates/horizon-client-render/src/gfx/native_render.rs"
name = "big_nukes_sky"
source = "sky.rs"
# The window's glue, in another crate, fills its list.
visibility = "pub"

# Everything that names the game's types.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes_glue"
source = "glue.rs"

# The machines and the bombs, declared in code; the ores and the ash are the assets half's files.
[[injection]]
id = "blocks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_blocks"
helper = "blocks.rs"
bindings = [
  { name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "&mut *blocks" },
]

[[injection]]
id = "items"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_items"
helper = "items.rs"
bindings = [
  { name = "items", ty = "&mut Vec<horizon_mods::content::Item>", value = "&mut *items" },
]

# The machines (the centrifuge, the assembly table) and the bombs: their block entities, slots, menus, work and
# screens (API 15-20, 309).
[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

# What hoppers may put in.
[[injection]]
id = "container-accepts"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_container_accepts"
helper = "container_accepts.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

[[injection]]
id = "block-entity-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# What each slot of the screen takes, for a player's clicks: on the library's side
# of the game, so it can't reach the glue.
[[injection]]
id = "slot-rules"
kind = "HEAD"
target = "horizon_client_lib::menu::native_menu_slot_rules"
helper = "slot_rules.rs"
bindings = [
  { name = "menu", ty = "&str", value = "menu" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "may_place", ty = "&mut bool", value = "&mut *may_place" },
]

[[injection]]
id = "quick-move"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_quick_move"
helper = "quick_move.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "container_slots", ty = "usize", value = "container_slots" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&mut horizon_client::items::ItemStack", value = "&mut *stack" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<horizon_client::mod_api::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_draw"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

# The bombs: a right click puts a detonator in or lights a fuse (API 21); the assembly table's button and the
