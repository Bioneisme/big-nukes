[mod]
id = "big_nukes_native"
version = "0.1.0"
priority = 100

# The Horizon source this bundle is planned and built on: Nightly 2026-11-05
# (`nightly-source/2026-11-05-66f3981`). It needs API 126 (`native_edit_blocks`).
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

# The rules: no game type, also the mod's Cargo library (its tests).
[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes"
source = "runtime.rs"

# The renderer's share: the clouds and the rings, over the finished world.
[[module]]
id = "sky"
file = "crates/horizon-client-render/src/gfx/native_render.rs"
name = "big_nukes_sky"
source = "sky.rs"
# The window's glue, in another crate, fills its list.
visibility = "pub"

# Everything that names the game's types.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes_glue"
source = "glue.rs"

# The machines and the bombs, declared in code; the ores and the ash are the assets half's files.
[[injection]]
id = "blocks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_blocks"
helper = "blocks.rs"
bindings = [
  { name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "&mut *blocks" },
]

[[injection]]
id = "items"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_items"
helper = "items.rs"
bindings = [
  { name = "items", ty = "&mut Vec<horizon_mods::content::Item>", value = "&mut *items" },
]

# A player joining: the warning when the assets half is missing (API 1).
[[injection]]
id = "logged-in"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_in"
helper = "logged_in.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

# The command (API 2).
[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<horizon_client::mod_api::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&horizon_client::mod_api::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# The server's ticks, counted (API 4).
[[injection]]
id = "server-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "horizon_client::mod_api::ServerTickPhase", value = "phase" },
]

# The end of each level's tick: where the waves work (API 23).
[[injection]]
id = "level-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_post"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# Chunks coming and going (API 57).
[[injection]]
id = "chunk-load"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_chunk_load"
helper = "chunk_load.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
]

[[injection]]
id = "chunk-unload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_chunk_unload"
helper = "chunk_unload.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
]

# The world closing (API 3).
[[injection]]
id = "lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = [
  { name = "phase", ty = "horizon_client::mod_api::WorldPhase", value = "phase" },
]

# News of a blast, in the window (API 40).
[[injection]]
id = "net-from-server"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "net_from_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The flash, over everything (API 410).
[[injection]]
id = "gui-render-post"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_gui_render_post"
helper = "gui_render_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "gui_hidden", ty = "bool", value = "gui_hidden" },
  { name = "focused", ty = "bool", value = "focused" },
]

# The ground shaking as the front passes (API 82).
[[injection]]
id = "camera-shake"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_camera_shake"
helper = "camera_shake.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "shake", ty = "&mut horizon_client::mod_api::NativeShake", value = "&mut *shake" },
]

# The renderer: the scene's depth while a blast is felt, and the drawing (API 58).
[[injection]]
id = "render-needs"
kind = "HEAD"
target = "horizon_client_render::gfx::native_render::native_render_needs"
helper = "render_needs.rs"
bindings = [
  { name = "needs", ty = "&mut crate::gfx::native_render::RenderNeeds", value = "&mut *needs" },
]

[[injection]]
id = "world-drawn"
kind = "HEAD"
target = "horizon_client_render::gfx::native_render::native_world_drawn"
helper = "world_drawn.rs"
bindings = [
  { name = "world", ty = "&mut crate::gfx::native_render::WorldDrawn<'_>", value = "&mut *world" },
]

# Every frame, on any screen: the renderer's list of blasts.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]
