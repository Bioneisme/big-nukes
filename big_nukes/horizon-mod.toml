id = "big_nukes_native"
name = "Big Nukes"
version = "0.4.1"
description = "Bombs whose shockwave rolls across the land: craters, fallout, sirens and bunkers."
authors = ["bioneisme"]
license = "MIT"
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]
# The blocks, items, effects and files are in the namespace the mod has always used, so saved worlds keep them.
namespaces = ["big_nukes"]

# Built by the launcher against this Horizon commit's prebuilt game.
[native]
game = "26.3"
horizon = "2b77287de099c9316278ba7ac4d83590fdb7ef30"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# The mushroom clouds and dust rings: a pass of the mod's own over the finished world (src/sky.rs holds the shader).
[[native.mixin]]
id = "sky"
target = "horizon_mod_render::render::world_drawn"
kind = "HEAD"
helper = "src/mixins/world_drawn.rs"
bindings = [{ name = "world", ty = "&mut WorldDrawn<'_>", value = "&mut *world" }]

[[native.mixin]]
id = "sky-needs"
target = "horizon_mod_render::render::render_needs"
kind = "HEAD"
helper = "src/mixins/render_needs.rs"
bindings = [{ name = "needs", ty = "&mut RenderNeeds", value = "&mut *needs" }]
